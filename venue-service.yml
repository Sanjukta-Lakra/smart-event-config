server:
  port: 8082

spring:
  application:
    name: VENUE-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/venue_db
    username: root
    password: sanju
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
